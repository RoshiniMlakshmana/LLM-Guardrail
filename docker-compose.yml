services:
  dashboard:
    build: ./aac
    ports:
      - "8501:8501"
    environment:
      GUARDRAIL_MODEL: artifacts/model_precision.joblib
      GUARDRAIL_DB: /tmp/dashboard_guardrail.db
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: llama3.2:3b
    extra_hosts:
      - "host.docker.internal:host-gateway"
